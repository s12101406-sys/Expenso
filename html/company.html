<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expenso — Company Tracker</title>
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/company.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="home.html">Expenso<span>.</span></a>
      <div class="topbar-actions">
        <span class="user-chip" id="userChip"></span>
        <button type="button" class="btn btn-ghost btn-sm" id="logoutBtn">Log out</button>
      </div>
    </header>

    <main class="page">
      <div class="tracker-header">
        <div>
          <a class="back-link" href="home.html">← Back to chooser</a>
          <h1>Company expenses</h1>
        </div>
      </div>

      <section class="summary-row company-summary" aria-live="polite">
        <article class="panel summary-card">
          <div class="label">Total spend</div>
          <div class="value" id="totalSpend">₹0.00</div>
        </article>
        <article class="panel summary-card">
          <div class="label">Pending approval</div>
          <div class="value pending" id="pendingSpend">₹0.00</div>
        </article>
        <article class="panel summary-card">
          <div class="label">Approved</div>
          <div class="value approved" id="approvedSpend">₹0.00</div>
        </article>
      </section>

      <section class="layout-split">
        <aside class="panel form-panel">
          <h2 id="formTitle">Log company expense</h2>
          <form class="expense-form" id="expenseForm">
            <input type="hidden" id="expenseId" />
            <div class="field">
              <label for="title">Description</label>
              <input type="text" id="title" required placeholder="Client lunch, software license…" maxlength="100" />
            </div>
            <div class="field">
              <label for="amount">Amount (₹)</label>
              <input type="number" id="amount" required min="0.01" step="0.01" placeholder="0.00" />
            </div>
            <div class="field">
              <label for="department">Department</label>
              <select id="department" required>
                <option value="Operations">Operations</option>
                <option value="Sales">Sales</option>
                <option value="Marketing">Marketing</option>
                <option value="Engineering">Engineering</option>
                <option value="HR">HR</option>
                <option value="Finance">Finance</option>
              </select>
            </div>
            <div class="field">
              <label for="employee">Employee / vendor</label>
              <input type="text" id="employee" required placeholder="Name or vendor" maxlength="60" />
            </div>
            <div class="field">
              <label for="category">Category</label>
              <select id="category" required>
                <option value="Travel">Travel</option>
                <option value="Meals">Meals</option>
                <option value="Software">Software</option>
                <option value="Office">Office</option>
                <option value="Equipment">Equipment</option>
                <option value="Other">Other</option>
              </select>
            </div>
            <div class="field">
              <label for="status">Status</label>
              <select id="status" required>
                <option value="pending">Pending</option>
                <option value="approved">Approved</option>
                <option value="rejected">Rejected</option>
              </select>
            </div>
            <div class="field">
              <label for="date">Date</label>
              <input type="date" id="date" required />
            </div>
            <button type="submit" class="btn btn-accent" id="submitBtn">Save expense</button>
            <button type="button" class="btn btn-ghost" id="cancelEditBtn" hidden>Cancel edit</button>
          </form>

          <div class="dept-bars" id="deptBars" aria-label="Spend by department"></div>
        </aside>

        <section class="panel list-panel">
          <h2>Company ledger</h2>
          <div class="filter-row">
            <div class="field">
              <label for="filterDepartment">Department</label>
              <select id="filterDepartment">
                <option value="all">All</option>
                <option value="Operations">Operations</option>
                <option value="Sales">Sales</option>
                <option value="Marketing">Marketing</option>
                <option value="Engineering">Engineering</option>
                <option value="HR">HR</option>
                <option value="Finance">Finance</option>
              </select>
            </div>
            <div class="field">
              <label for="filterStatus">Status</label>
              <select id="filterStatus">
                <option value="all">All</option>
                <option value="pending">Pending</option>
                <option value="approved">Approved</option>
                <option value="rejected">Rejected</option>
              </select>
            </div>
            <div class="field">
              <label for="searchInput">Search</label>
              <input type="search" id="searchInput" placeholder="Description or person…" />
            </div>
          </div>

          <div class="desktop-table">
            <table class="expense-table">
              <thead>
                <tr>
                  <th>Description</th>
                  <th>Dept</th>
                  <th>Person</th>
                  <th>Status</th>
                  <th>Date</th>
                  <th>Amount</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="expenseTableBody"></tbody>
            </table>
          </div>
          <div class="mobile-cards" id="expenseCards"></div>
          <div class="empty-state" id="emptyState" hidden>No company expenses yet. Log the first one on the left.</div>
        </section>
      </section>
    </main>
  </div>

  <script src="../js/storage.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/company.js"></script>
</body>
</html>
